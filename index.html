<style>
:root{
  --bg:#efe3d2; --surface:#f8efe2; --line:#d9c7ae; --text:#2a1a17; --muted:#7a6459;
  --red:#b8271d; --gold:#a8760f; --fire:#d9541e; --on-red:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120d10; --surface:#1b1418; --line:#33262c; --text:#f3e9df; --muted:#a8968f;
    --red:#e0392d; --gold:#f1c24b; --fire:#ff7a2f; --on-red:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#120d10; --surface:#1b1418; --line:#33262c; --text:#f3e9df; --muted:#a8968f;
  --red:#e0392d; --gold:#f1c24b; --fire:#ff7a2f; --on-red:#fff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:inherit;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif; line-height:1.5; overflow-x:hidden;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface);}
button,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--fire); outline-offset:2px;}

header{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;}
.bar{max-width:980px; margin:0 auto; display:flex; align-items:center; gap:12px;}
.mark{width:40px; height:40px; flex:none; background:var(--red); color:var(--on-red); display:grid; place-items:center;
  font-family:'Dela Gothic One',Impact,sans-serif; font-size:24px; border-radius:50%;}
.brand{font-family:'Dela Gothic One',Impact,sans-serif; font-size:1.4rem; line-height:1;}
.cult{color:var(--muted); font-size:.82rem; line-height:1.2; margin-top:3px;}
.lang{margin-left:auto; display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none;}
.lang button{background:none; border:0; padding:6px 12px; font-weight:700; cursor:pointer;}
.lang button[aria-pressed="true"]{background:var(--red); color:var(--on-red);}

.layout{max-width:980px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 300px;}
main{border-left:1px solid var(--line); border-right:1px solid var(--line); min-height:100vh;}
aside{padding:16px;}

.composer{display:grid; grid-template-columns:44px 1fr; gap:12px; padding:16px; border-bottom:1px solid var(--line);}
.composer textarea{width:100%; min-height:64px; resize:vertical; background:transparent; border:0;
  border-bottom:1px solid var(--line); padding:6px 0; font-size:1.05rem;}
.composer textarea:focus-visible{outline:none; border-bottom-color:var(--fire);}
.row{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;}
.btn{border:1px solid var(--line); background:transparent; padding:7px 16px; border-radius:999px; cursor:pointer; font-weight:700;}
.btn.go{background:var(--red); border-color:var(--red); color:var(--on-red);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

#banner{display:none; width:100%; border:0; border-bottom:1px solid var(--line); background:var(--fire);
  color:#fff; padding:10px; font-weight:700; cursor:pointer;}
#banner.show{display:block;}

.post{display:grid; grid-template-columns:44px 1fr; gap:12px; padding:16px; border-bottom:1px solid var(--line);}
.post.fresh{animation:drop .45s ease-out;}
@keyframes drop{from{opacity:0; transform:translateY(-10px);}to{opacity:1; transform:none;}}
.av{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff;
  font-family:'Dela Gothic One',Impact,sans-serif; font-size:1.05rem;}
.head{display:flex; flex-wrap:wrap; gap:2px 6px; align-items:baseline;}
.name{font-weight:700;}
.meta{color:var(--muted); font-size:.92rem;}
.rep{color:var(--muted); font-size:.9rem;}
.rep b{color:var(--fire); font-weight:400;}
.text{margin:4px 0 8px; font-size:1.04rem; overflow-wrap:anywhere;}
.acts{display:flex; gap:28px; color:var(--muted); font-size:.9rem;}
.acts button{background:none; border:0; padding:4px 0; cursor:pointer; color:inherit; display:flex; gap:6px; align-items:center;}
.acts .rp.on{color:var(--gold);} .acts .lk.on{color:var(--red);}
.pin{padding:10px 16px 0 72px; color:var(--muted); font-size:.88rem;}
.badge{color:var(--gold); font-size:.85rem; font-weight:400;}

.card{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:16px; margin-bottom:16px;}
.card h2{font-family:'Dela Gothic One',Impact,sans-serif; font-size:1.15rem; margin:0 0 4px; font-weight:400;}
.card .bio{color:var(--muted); margin:0 0 12px; font-size:.95rem;}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;}
.stats b{display:block; font-family:'Dela Gothic One',Impact,sans-serif; font-weight:400; font-size:1.1rem; color:var(--fire);}
.stats span{font-size:.78rem; color:var(--muted);}
.tr{padding:8px 0; border-top:1px solid var(--line);}
.tr:first-of-type{border-top:0;}
.tr b{display:block;} .tr span{color:var(--muted); font-size:.85rem;}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
  aside{order:-1; padding:12px 16px 0;}
  .trend{display:none;}
  main{border-left:0; border-right:0;}
}
@media (prefers-reduced-motion:reduce){ .post.fresh{animation:none;} }
</style>
</head>

const UI={
 en:{cult:"Order of Sublime Creation",ph:"Speak to the faithful…",sum:"Summon a cultist",pin:"Pinned by our Lord and Savior",role:"✦ Lord and Savior",bio:"@deidara_art · Wild magic sorcerer, level 7. Art is a bang. Un.",s1:"Fired",s2:"Aura",s3:"Surges today",tr:"Trending among the fired",pt:"Not cultists (officially)",posts:"posts",rep:"Replying to",now:"now",m:"m",title:"Katsu — Order of Sublime Creation",loc:"en-US"},
 cs:{cult:"Řád Vznešeného Tvoření",ph:"Promluv k věrným…",sum:"Přivolat věřícího",pin:"Připnuto naším Pánem a Spasitelem",role:"✦ Pán a Spasitel",bio:"@deidara_art · Čaroděj divoké magie, 7. úroveň. Umění je třesk. Un.",s1:"Vypálení",s2:"Aura",s3:"Vlny dnes",tr:"Trendy mezi vypálenými",pt:"Ne kultisté (oficiálně)",posts:"příspěvků",rep:"Odpověď uživateli",now:"teď",m:" min",title:"Katsu — Řád Vznešeného Tvoření",loc:"cs-CZ"}
};

const R=(a)=>a[Math.floor(Math.random()*a.length)];
const N=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L="en"; try{const v=localStorage.getItem("katsu-lang"); L=(v==="en"||v==="cs")?v:((navigator.language||"").toLowerCase().startsWith("cs")?"cs":"en");}catch(e){ L=(navigator.language||"").toLowerCase().startsWith("cs")?"cs":"en"; }
const I=()=>L==="cs"?1:0;
const fmt=(n)=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(".0","")+"k":String(n);
const ago=(t)=>t<1?UI[L].now:t<60?t+UI[L].m:Math.floor(t/60)+"h";
const fill=(s,ph)=>s.replace(/\{(\w+)\}/g,(_,k)=>{
  const p=PL[ph.p];
  return k==="p"?p.en:k==="pn"?p.n:k==="pl"?p.l:k==="pi"?p.i:k==="pa"?p.a:k==="s"?SG[ph.s][I()]:k==="n"?ph.n.toLocaleString(UI[L].loc):ph.d;
});
const txt=(p)=>p.raw!==undefined?p.raw:fill(p.tx[I()],p.ph);

function gen(t,o={}){
  const team=o.who!==undefined||(!o.reply&&Math.random()<.18);
  const a=team?TEAM[o.who!==undefined?o.who:N(0,1)]:R(CAST);
  let tx=R(team?TT[a.h]:T), reply=null;
  if(o.reply){ reply=o.reply; tx=team?R(TRE[a.h]):R(FANS); }
  else if(!team&&Math.random()<.2){ reply=R(CAST.filter(c=>c!==a)).h; tx=R(RE); }
  return {a,tx,reply,ph:{p:N(0,7),s:N(0,7),n:N(100,9000),d:N(2,300)},t,l:Math.floor(Math.random()**3*4800)+3,r:Math.floor(Math.random()**3*900),c:N(0,160),lo:0,ro:0};
}

function el(p,fresh){
  const d=document.createElement("article"); d.className="post"+(fresh?" fresh":"");
  const a=p.a, nm=a.n[I()], bd=a.b?a.b[I()]:"";
  d.innerHTML=`<div class="av" style="background:${a.c};${p.mine?"color:#f1c24b":""}">${esc(nm.charAt(0).toUpperCase())}</div>
  <div><div class="head"><span class="name">${esc(nm)}${p.mine?' <span class="badge">✦</span>':""}${bd?' <span class="badge">'+esc(bd)+'</span>':""}</span>
  <span class="meta">@${esc(a.h)} · ${ago(p.t)}</span></div>
  ${p.reply?`<div class="rep">${UI[L].rep} <b>@${esc(p.reply)}</b></div>`:""}
  <div class="text"></div>
  <div class="acts"><span>💬 ${fmt(p.c)}</span>
  <button class="rp${p.ro?" on":""}" type="button" aria-pressed="${!!p.ro}">⟲ <i>${fmt(p.r)}</i></button>
  <button class="lk${p.lo?" on":""}" type="button" aria-pressed="${!!p.lo}">♥ <i>${fmt(p.l)}</i></button></div></div>`;
  d.querySelector(".text").textContent=txt(p);
  [["rp","r","ro"],["lk","l","lo"]].forEach(([c,k,f])=>{
    const b=d.querySelector("."+c); b.onclick=()=>{
      p[f]=p[f]?0:1; b.classList.toggle("on",!!p[f]); b.setAttribute("aria-pressed",!!p[f]);
      p[k]+=p[f]?1:-1; b.querySelector("i").textContent=fmt(p[k]);
    };
  });
  return d;
}

const feed=document.getElementById("feed"), banner=document.getElementById("banner"), pinned=document.getElementById("pinned");
const PIN={a:DEI,mine:true,t:60*24*3,l:9421,r:2310,c:688,lo:0,ro:0,ph:{p:0,s:0,n:0,d:0},
  tx:["Art is a bang. Not a whisper. If you’re reading this, you’re already clay. Un.","Umění je třesk. Ne šepot. Pokud tohle čteš, už jsi hlína. Un."]};
let posts=[], pending=[];
let t=2; for(let i=0;i<12;i++){ t+=N(3,55); posts.push(gen(t,i===3?{who:1}:i===7?{who:0}:{})); }
const TRC=TR.map(()=>N(300,9000));
let aura=128400, fol=3317, sur=4;

function add(p){ posts.unshift(p); feed.prepend(el(p,true)); }
function bn(n){
  if(L==="en") return "Show "+n+" new post"+(n>1?"s":"");
  return "Zobrazit "+n+(n===1?" nový příspěvek":n<5?" nové příspěvky":" nových příspěvků");
}
function upd(){ if(!pending.length){ banner.classList.remove("show"); return; } banner.textContent=bn(pending.length); banner.classList.add("show"); }
function stats(){
  const lc=UI[L].loc;
  document.getElementById("aura").textContent=aura.toLocaleString(lc);
  document.getElementById("fol").textContent=fol.toLocaleString(lc);
  document.getElementById("sur").textContent=sur;
}
function render(){
  const u=UI[L];
  document.documentElement.lang=L; document.title=u.title;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=u[e.dataset.k]);
  document.getElementById("box").placeholder=u.ph;
  document.getElementById("box").setAttribute("aria-label",u.ph);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  pinned.replaceChildren(el(PIN,false));
  feed.replaceChildren(...posts.map(p=>el(p,false)));
  document.getElementById("party").innerHTML=TEAM.map(m=>
    `<div class="tr"><b>${esc(m.n[I()])} <span class="badge">${esc(m.b[I()])}</span></b><span>@${m.h} · ${esc(m.bio[I()])}</span></div>`).join("");
  document.getElementById("trends").innerHTML=TR.map((x,i)=>
    `<div class="tr"><b>${esc(x[I()*1===0?0:1])}</b><span>${esc(x[I()===0?2:3])} · ${fmt(TRC[i])} ${u.posts}</span></div>`).join("");
  stats(); upd();
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  L=b.dataset.l; try{localStorage.setItem("katsu-lang",L);}catch(e){} render();
});
banner.onclick=()=>{ pending.forEach(add); pending=[]; upd(); };
setInterval(()=>{ pending.push(gen(0)); upd(); },7000);
document.getElementById("summon").onclick=()=>add(gen(0));

const box=document.getElementById("box"), send=document.getElementById("send");
box.oninput=()=>{send.disabled=!box.value.trim();};
send.onclick=()=>{
  const v=box.value.trim(); if(!v) return;
  add({a:DEI,mine:true,raw:v,reply:null,t:0,l:0,r:0,c:0,lo:0,ro:0,ph:PIN.ph,tx:["",""]});
  box.value=""; send.disabled=true;
  [1100,2400,3800].forEach(ms=>setTimeout(()=>add(gen(0,{reply:"deidara_art"})),ms));
  [4800,6400].forEach((ms,i)=>setTimeout(()=>add(gen(0,{who:1-i,reply:"deidara_art"})),ms));
};
setInterval(()=>{
  aura+=N(5,60); if(Math.random()<.18) fol++; if(Math.random()<.03) sur++; stats();
},2000);

render();
</script>
</body>
</html>
